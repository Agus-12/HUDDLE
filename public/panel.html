<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huddle — Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0b14;color:#efeaf7;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:0;min-height:100vh}
.navbar{background:#17131f;border-bottom:1px solid #2a2338;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.navbar .back{background:none;border:none;color:#8a5cf6;font-size:20px;cursor:pointer;padding:4px 8px;display:none}
.navbar .back.show{display:block}
.navbar h1{font-size:17px;display:flex;align-items:center;gap:8px;flex:1}
.navbar h1 .dot{width:9px;height:9px;border-radius:50%;background:#38e08a;box-shadow:0 0 6px #38e08a}
.navbar .right{display:flex;align-items:center;gap:12px}
.navbar .clock{font-size:12px;color:#9d93b5;font-variant-numeric:tabular-nums}
.bell{position:relative;background:none;border:none;color:#9d93b5;font-size:18px;cursor:pointer;padding:4px}
.bell:hover{color:#efeaf7}
.bell .badge{position:absolute;top:-2px;right:-4px;background:#ff5c7a;color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:14px;text-align:center}
.page{display:none;padding:16px;max-width:800px;margin:0 auto}
.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.card{background:#17131f;border:1px solid #2a2338;border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:#8a5cf6}
.card .n{font-size:24px;font-weight:800}
.card .t{color:#9d93b5;font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
.card.noclick{cursor:default}.card.noclick:hover{border-color:#2a2338}
.sec-title{font-size:13px;color:#9d93b5;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px}
.fcard{background:#17131f;border:1px solid #2a2338;border-radius:14px;padding:16px;cursor:pointer;transition:border-color .2s;margin-bottom:10px}
.fcard:hover{border-color:#8a5cf6}
.fcard .fhead{display:flex;align-items:center;justify-content:space-between}
.fcard .fname{font-size:16px;font-weight:700}
.fcard .fcount{font-size:28px;font-weight:800}
.fcard .fsub{font-size:11px;color:#9d93b5;margin-top:2px}
.fcard .bar{height:6px;background:#241d31;border-radius:99px;overflow:hidden;margin-top:8px}
.fcard .bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1a1625}
.urow:last-child{border-bottom:0}
.udot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.udot.green{background:#38e08a;box-shadow:0 0 5px #38e08a}
.udot.yellow{background:#ffb020;box-shadow:0 0 5px #ffb020}
.udot.red{background:#ff5c7a}
.uname{flex:1;font-size:13px}
.udate{font-size:11px;color:#9d93b5;min-width:80px;text-align:right}
.ubtn{background:#ff5c7a;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.detail-section{background:#17131f;border:1px solid #2a2338;border-radius:14px;padding:16px;margin-bottom:12px}
.detail-section h3{font-size:14px;margin-bottom:10px}
.barra{height:10px;background:#241d31;border-radius:99px;overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;border-radius:99px;transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:#0d0b14;border:1px solid #2a2338;border-radius:99px;padding:5px 11px;font-size:12px}
.chip b{font-weight:800}.chip.ok b{color:#38e08a}.chip.warn b{color:#ffb020}.chip.bad b{color:#ff5c7a}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{text-align:left;color:#9d93b5;font-size:10px;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid #2a2338}
td{padding:5px 4px;border-bottom:1px solid #1a1625}
.toggle-btn{background:none;border:1px solid #2a2338;border-radius:8px;color:#9d93b5;padding:6px 14px;font-size:12px;cursor:pointer;margin:6px 0}
.toggle-btn:hover{border-color:#8a5cf6;color:#efeaf7}
.pie{color:#9d93b5;font-size:11px;text-align:center;padding:16px}
.user-legend{display:flex;gap:12px;font-size:11px;color:#9d93b5;margin-bottom:10px}
.user-legend span{display:flex;align-items:center;gap:4px}
.log-entry{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #1a1625;font-size:12px}
.log-entry:last-child{border-bottom:0}
.log-icon{flex-shrink:0;width:20px;text-align:center}
.log-msg{flex:1;color:#b8aed0}
.log-time{color:#9d93b5;font-size:10px;min-width:60px;text-align:right;flex-shrink:0}
.notif-panel{position:fixed;top:52px;right:12px;background:#17131f;border:1px solid #2a2338;border-radius:14px;padding:12px;max-width:340px;width:calc(100vw - 24px);max-height:60vh;overflow-y:auto;z-index:20;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.notif-panel.show{display:block}
.notif-title{font-size:13px;color:#9d93b5;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.notif-close{background:none;border:none;color:#9d93b5;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<div class="navbar">
  <button class="back" id="backBtn" onclick="goBack()">←</button>
  <h1><span class="dot"></span> Huddle</h1>
  <div class="right">
    <span class="clock" id="clock"></span>
    <button class="bell" id="bellBtn" onclick="toggleNotifs()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge" id="bellBadge" style="display:none">0</span>
    </button>
  </div>
</div>

<!-- Notifications dropdown -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-title">Notificaciones de sonda <button class="notif-close" onclick="toggleNotifs()">✕</button></div>
  <div id="notifList"></div>
</div>

<!-- DASHBOARD -->
<div class="page active" id="pageDash">
  <div class="grid" id="dashCards"></div>
  <div class="sec-title">Catálogo total</div>
  <div class="grid" id="catCards"></div>
  <div id="catDetail" style="font-size:12px;color:#9d93b5;line-height:1.8;margin-bottom:16px"></div>
  <div class="sec-title">Fuentes de video</div>
  <div id="fuentesCards"></div>
  <div class="sec-title">Rastreador de intros</div>
  <button class="toggle-btn" onclick="toggleIntros()">▸ Mostrar intros aprendidas</button>
  <div id="introsWrap" style="display:none"></div>
  <p class="pie" id="pie">conectando…</p>
</div>

<!-- USUARIOS -->
<div class="page" id="pageUsers">
  <div class="sec-title">Usuarios <span id="userCount" style="float:right"></span></div>
  <div class="user-legend">
    <span><div class="udot green"></div> En linea</span>
    <span><div class="udot yellow"></div> Inactivo &lt;2 sem</span>
    <span><div class="udot red"></div> &gt;3 sem</span>
  </div>
  <div id="usersList"></div>
</div>

<!-- FUENTE DETAIL -->
<div class="page" id="pageFuente">
  <div id="fuenteContent"></div>
</div>

<script>
var _estado=null,_stats=null,_notifs=[],_seenNotifs=0;
var TWO_W=14*86400000, THREE_W=21*86400000;

function fmt(s){
  if(s===null||s===undefined)return'--';
  var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d>0)return d+'d '+h+'h';
  if(h>0)return h+'h '+m+'m';
  return m+'m';
}
function timeAgo(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

function updateClock(){
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  document.getElementById('clock').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
updateClock();setInterval(updateClock,1000);

function toggleNotifs(){
  var p=document.getElementById('notifPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show')){_seenNotifs=_notifs.length;updateBell();}
}

function updateBell(){
  var newCount=_notifs.length-_seenNotifs;
  var badge=document.getElementById('bellBadge');
  if(newCount>0){badge.textContent=newCount>99?'99+':newCount;badge.style.display='';}
  else{badge.style.display='none';}
}

function renderNotifs(){
  var html='';
  if(!_notifs.length){html='<div style="color:#9d93b5;font-size:12px;padding:8px 0">Sin notificaciones</div>';}
  _notifs.slice(0,30).forEach(function(n){
    var icon=n.tipo==='muerto'?'✕':'✓';
    var color=n.tipo==='muerto'?'#ff5c7a':'#38e08a';
    html+='<div class="log-entry">'
      +'<div class="log-icon" style="color:'+color+';font-weight:800">'+icon+'</div>'
      +'<div class="log-msg"><b style="color:'+color+'">'+n.fuente+'</b> '+n.msg+'</div>'
      +'<div class="log-time">'+timeAgo(n.ts)+'</div></div>';
  });
  document.getElementById('notifList').innerHTML=html;
}

function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page'+id).classList.add('active');
  document.getElementById('backBtn').classList.toggle('show',id!=='Dash');
  document.getElementById('notifPanel').classList.remove('show');
  window.scrollTo(0,0);
}
function goBack(){showPage('Dash');}

function toggleIntros(){
  var w=document.getElementById('introsWrap');
  var btn=w.previousElementSibling;
  if(w.style.display==='none'){w.style.display='';btn.textContent='▾ Ocultar intros';}
  else{w.style.display='none';btn.textContent='▸ Mostrar intros aprendidas';}
}

function renderDash(d){
  _estado=d;
  document.getElementById('dashCards').innerHTML=
    '<div class="card noclick"><div class="n">'+fmt(d.encendidoHace)+'</div><div class="t">Encendido</div></div>'
    +'<div class="card noclick"><div class="n">'+d.memoriaMb+' MB</div><div class="t">Memoria</div></div>'
    +'<div class="card noclick"><div class="n">'+d.salasActivas+'</div><div class="t">Salas</div></div>'
    +'<div class="card" onclick="showPage(\'Users\')"><div class="n">'+d.usuarios+'</div><div class="t">Usuarios ▸</div></div>';
  var ca=d.catalogos||{};
  var f=_stats?_stats.fuentes:{};
  var tp=0;for(var k in f){if(k!=='latanime'&&k!=='caricaturas')tp+=Math.max(0,f[k].activas||0);}
  var laAct=f.latanime?Math.max(0,f.latanime.activas||0):0;
  var ts=(ca.animes||0);
  var tc=f.caricaturas?Math.max(0,f.caricaturas.activas||0):((ca.caricaturas||0)+(ca.cartoons||0)+(ca.liveaction||0));
  var gt=tp+ts+tc;
  document.getElementById('catCards').innerHTML=
    '<div class="card noclick"><div class="n" style="color:#38e08a">'+tp+'</div><div class="t">Películas</div></div>'
    +'<div class="card noclick"><div class="n" style="color:#8a5cf6">'+ts+'</div><div class="t">Series</div></div>'
    +'<div class="card noclick"><div class="n" style="color:#38bdf8">'+tc+'</div><div class="t">Caricaturas</div></div>'
    +'<div class="card noclick"><div class="n" style="color:#ffb020">'+gt+'</div><div class="t">Total</div></div>';
  document.getElementById('catDetail').innerHTML=
    'Caricaturas: <b>'+ca.caricaturas+'</b> · Cartoons: <b>'+ca.cartoons+'</b> · Live Action: <b>'+ca.liveaction+'</b> · Danimados: <b>'+ca.danimados+'</b> · Animes: <b>'+ca.animes+'</b>';
  var ii=d.intros||{};
  var pct=ii.total?Math.round(ii.analizados*100/ii.total):0;
  var ih='<div class="barra"><i style="width:'+pct+'%;background:linear-gradient(90deg,#8a5cf6,#38e08a)"></i></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#9d93b5;margin-bottom:8px">'
    +'<span>'+ii.analizados+' de '+ii.total+' episodios</span><span>'+pct+'%</span></div>'
    +'<div class="chips">'
    +'<span class="chip ok">Aprendidas <b>'+ii.aprendidas+'</b></span>'
    +'<span class="chip warn">Sin intro <b>'+ii.sinIntro+'</b></span>'
    +'<span class="chip">En cola <b>'+ii.enCola+'</b></span></div>';
  if(ii.muestra&&ii.muestra.length){
    ih+='<table><thead><tr><th>Sitio</th><th>Serie</th><th>Temp</th><th>Seg</th></tr></thead><tbody>';
    ii.muestra.forEach(function(m){ih+='<tr><td>'+m.sitio+'</td><td>'+m.serie+'</td><td>T'+m.temporada+'</td><td>'+m.inicio+' → '+m.fin+'</td></tr>';});
    ih+='</tbody></table>';
  }
  document.getElementById('introsWrap').innerHTML=ih;
  document.getElementById('pie').textContent='Actualizado '+new Date().toLocaleTimeString('es');
}

function renderFuentes(stats){
  _stats=stats;
  var f=stats.fuentes||{};
  var colors={cuevana:'#38e08a',pelisxd:'#8a5cf6',cinecalidad:'#38bdf8',latanime:'#ffb020',caricaturas:'#ffd93b'};
  var logos={cuevana:'cuevana.png',pelisxd:'pelisxd.png',cinecalidad:'cinecalidad.png',latanime:'latanime.png',caricaturas:'caricaturas.png'};
  var totalAct=0,html='';
  for(var k in f){
    var s=f[k];var c=colors[k]||'#efeaf7';
    var act=Math.max(0,s.activas||0);
    totalAct+=act;
    var pct=s.total?Math.round(act*100/s.total):0;
    var logo=logos[k]?'<img src="/sites/'+logos[k]+'?v=2406" alt="" style="width:40px;height:40px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 6px '+c+'66)" onerror="this.style.display=\'none\'">':'';
    html+='<div class="fcard" onclick="showFuente(\''+k+'\')">'
      +'<div class="fhead"><div style="display:flex;align-items:center;gap:10px">'+logo+'<div><div class="fname" style="color:'+c+'">'+s.nombre+'</div>'
      +'<div class="fsub">'+s.total+' total · '+s.ocultas+' ocultas</div></div></div>'
      +'<div class="fcount" style="color:'+c+'">'+act+'</div></div>'
      +'<div class="bar"><i style="width:'+pct+'%;background:'+c+'"></i></div></div>';
  }
  document.getElementById('fuentesCards').innerHTML=html;
}

function showFuente(k){
  var f=_stats?_stats.fuentes[k]:null;if(!f)return;
  var colors={cuevana:'#38e08a',pelisxd:'#8a5cf6',cinecalidad:'#38bdf8',latanime:'#ffb020',caricaturas:'#ffd93b'};
  var names={cuevana:'Cuevana',pelisxd:'PelisXD',cinecalidad:'CineCalidad',latanime:'Latanime',caricaturas:'Caricaturas'};
  var c=colors[k]||'#efeaf7';
  var logos={cuevana:'cuevana.png',pelisxd:'pelisxd.png',cinecalidad:'cinecalidad.png',latanime:'latanime.png',caricaturas:'caricaturas.png'};
  var logo=logos[k]?'<img src="/sites/'+logos[k]+'?v=2406" alt="" style="width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:10px;filter:drop-shadow(0 0 8px '+c+'66)" onerror="this.style.display=\'none\'">':'';
  var act=Math.max(0,f.activas||0);
  var pct=f.total?Math.round(act*100/f.total):0;
  var html='<div class="detail-section"><h3 style="color:'+c+'">'+logo+f.nombre+'</h3>'
    +'<div class="barra"><i style="width:'+pct+'%;background:'+c+'"></i></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#9d93b5;margin:6px 0">'
    +'<span>'+act+' activas de '+f.total+'</span><span>'+pct+'%</span></div>'
    +'<div class="chips">'
    +'<span class="chip ok">Activas <b>'+act+'</b></span>'
    +'<span class="chip bad">Ocultas <b>'+f.ocultas+'</b></span>'
    +'<span class="chip">Verificadas <b>'+(f.vistas||0)+'</b></span></div></div>'
    +'<div class="detail-section"><h3>Log de la sonda</h3>'
    +'<div id="fuenteLog-'+k+'"><div style="color:#9d93b5;font-size:12px">Cargando…</div></div></div>';
  document.getElementById('fuenteContent').innerHTML=html;
  showPage('Fuente');
  // Load sonda log for this source
  fetch('/api/sonda-log?fuente='+encodeURIComponent(names[k]||k)+'&limit=30')
    .then(function(r){return r.json()})
    .then(function(d){
      var el=document.getElementById('fuenteLog-'+k);
      if(!d.items||!d.items.length){el.innerHTML='<div style="color:#9d93b5;font-size:12px">Sin movimientos recientes</div>';return;}
      var lh='';
      d.items.forEach(function(n){
        var icon=n.tipo==='muerto'?'✕':'✓';
        var col=n.tipo==='muerto'?'#ff5c7a':'#38e08a';
        lh+='<div class="log-entry">'
          +'<div class="log-icon" style="color:'+col+';font-weight:800">'+icon+'</div>'
          +'<div class="log-msg" style="color:'+col+'">'+n.msg+'</div>'
          +'<div class="log-time">'+timeAgo(n.ts)+'</div></div>';
      });
      el.innerHTML=lh;
    }).catch(function(){});
}

function renderUsers(data){
  var users=data.usuarios||[];
  var sorted=users.slice().sort(function(a,b){
    if(a.online&&!b.online)return-1;
    if(!a.online&&b.online)return 1;
    return(b.lastSeenAt||0)-(a.lastSeenAt||0);
  });
  var green=0,yellow=0,red=0,html='';
  sorted.forEach(function(u){
    var cls,age=u.lastSeenAt?Date.now()-u.lastSeenAt:Infinity;
    if(u.online){cls='green';green++;}
    else if(age<TWO_W){cls='yellow';yellow++;}
    else{cls='red';red++;}
    var dt=u.lastSeenAt?new Date(u.lastSeenAt).toLocaleDateString('es'):'—';
    var status=u.online?'- en linea':'';
    html+='<div class="urow">'
      +'<div class="udot '+cls+'"></div>'
      +'<div class="uname">'+u.name+(status?' <span style="font-size:10px;color:#38e08a">'+status+'</span>':'')+'</div>'
      +'<div class="udate">'+dt+'</div>'
      +'<button class="ubtn" onclick="eliminarUser(\''+u.name.replace(/'/g,"\\'")+'\')">Eliminar</button></div>';
  });
  document.getElementById('usersList').innerHTML=html||'<div style="color:#9d93b5;font-size:13px;padding:20px 0">Sin usuarios</div>';
  document.getElementById('userCount').innerHTML=
    '<span style="color:#38e08a">'+green+'</span> en linea · '
    +'<span style="color:#ffb020">'+yellow+'</span> inactivos · '
    +'<span style="color:#ff5c7a">'+red+'</span> desactivados';
}

function tic(){
  fetch('/api/estado').then(function(r){return r.json()}).then(renderDash).catch(function(e){
    document.getElementById('pie').textContent='Error: '+(e&&e.message||e);
  });
  fetch('/api/stats').then(function(r){return r.json()}).then(renderFuentes).catch(function(){});
  fetch('/api/users').then(function(r){return r.json()}).then(renderUsers).catch(function(){});
  fetch('/api/sonda-log?limit=50').then(function(r){return r.json()}).then(function(d){
    _notifs=d.items||[];
    renderNotifs();
    updateBell();
  }).catch(function(){});
}
tic();setInterval(tic,5000);

function eliminarUser(name){
  if(!confirm('Eliminar "'+name+'"?\nAlguien más podrá usar ese nombre.'))return;
  fetch('/api/users',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
  .then(function(r){return r.json()}).then(function(d){if(d.ok){alert('Eliminado');tic();}else alert(d.error||'Error');})
  .catch(function(){alert('Error');});
}
</script>
</body>
</html>
